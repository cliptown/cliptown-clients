[package]
name = "cliptown-client-rust"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/cliptown/cliptown-clients"

[dependencies]
async-trait = "0.1"
cliptown-interfaces-rust = { path = "../../../cliptown-interfaces/generated/rust" }
cliptown-lib = { git = "https://github.com/cliptown/cliptown-lib", rev = "5c68349aadc5fb44c60f365ad457b58c42ed5d27", package = "cliptown-lib" }
hmac = "0.12"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
