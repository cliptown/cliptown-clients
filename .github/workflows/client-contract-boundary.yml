name: client-contract-boundary

on:
  pull_request:
    paths:
      - "clients/**"
      - "scripts/verify_client_contract.py"
      - "tools/contract-boundary/**"
      - ".zpkg.toml"
      - ".zpkg.lock"
      - ".github/workflows/client-contract-boundary.yml"
  push:
    branches: [main]
    paths:
      - "clients/**"
      - "scripts/verify_client_contract.py"
      - "tools/contract-boundary/**"
      - ".zpkg.toml"
      - ".zpkg.lock"
      - ".github/workflows/client-contract-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-contract-boundary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned Draft 2020-12 validators
        run: >-
          python -m pip install --disable-pip-version-check
          jsonschema==4.25.1 referencing==0.36.2 rpds-py==0.27.0
      - name: Validate schema, fingerprints, markers, and Zed provenance
        run: python3 scripts/verify_client_contract.py
      - name: Set up Rust 1.88 for public/private boundary
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Run Rust public/private API boundary regressions
        run: cargo test --manifest-path tools/contract-boundary/Cargo.toml --all-targets
      - name: Fail closed on published client symbols
        run: cargo run --quiet --manifest-path tools/contract-boundary/Cargo.toml -- .
