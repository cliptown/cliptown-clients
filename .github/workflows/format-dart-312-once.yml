name: format-dart-312-once
on:
  push:
    branches: [agent/cliptown-strong-skeletons]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cliptown-strong-skeletons
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - name: Apply pinned formatter and remove workflow
        run: |
          dart format clients/dart/lib clients/dart/test
          rm .github/workflows/format-dart-312-once.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: normalize Dart sources with SDK 3.12.2'
          git push origin HEAD:agent/cliptown-strong-skeletons
