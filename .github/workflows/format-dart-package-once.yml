name: format-dart-package-once
on:
  push:
    branches: [agent/cliptown-strong-skeletons]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cliptown-strong-skeletons
          path: cliptown-clients
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: cliptown/cliptown-interfaces
          ref: main
          path: cliptown-interfaces
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - name: Resolve package, format, and remove workflow
        working-directory: cliptown-clients/clients/dart
        run: |
          dart pub get
          dart format lib test
          rm ../../.github/workflows/format-dart-package-once.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: format Dart with resolved language version'
          git push origin HEAD:agent/cliptown-strong-skeletons
