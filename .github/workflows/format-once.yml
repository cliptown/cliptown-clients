name: format-once
on:
  push:
    branches: [agent/cliptown-strong-skeletons]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cliptown-strong-skeletons
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt}
      - uses: dart-lang/setup-dart@v1
      - name: Apply formatters and remove this one-time workflow
        run: |
          cargo fmt --manifest-path clients/rust/Cargo.toml
          dart format clients/dart
          rm .github/workflows/format-once.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: apply canonical Rust and Dart formatting'
          git push origin HEAD:agent/cliptown-strong-skeletons
