name: clients-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: clients-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zed-graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out clients
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
      - name: Validate canonical package graph
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import tomllib

          root = pathlib.Path('.')
          manifest = tomllib.loads((root / '.zpkg.toml').read_text())
          lock = tomllib.loads((root / '.zpkg.lock').read_text())
          assert manifest['dependencies'] == {
              'cliptown/cliptown-interfaces': '^0.1.0',
              'cliptown/cliptown-lib': '^0.1.0',
          }
          assert lock.get('version') == 1
          PY
          grep -F 'eafe227afad95b75673c3e9b704cf9cc3bc2ee9d' clients/rust/Cargo.toml
          grep -F 'https://github.com/cliptown/cliptown-lib' clients/rust/Cargo.lock
          grep -F 'eafe227afad95b75673c3e9b704cf9cc3bc2ee9d' clients/rust/Cargo.lock
          grep -F 'pub mod shared_policy;' clients/rust/src/lib.rs

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out clients
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cliptown-clients
          persist-credentials: false
          show-progress: false
      - name: Check out exact interfaces sibling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cliptown/cliptown-interfaces
          ref: ec4f820bcc9181c2423a6963d3890ddc8ef18b97
          path: cliptown-interfaces
          persist-credentials: false
          show-progress: false
      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Verify locked dependency graph
        working-directory: cliptown-clients/clients/rust
        run: cargo metadata --locked --format-version 1 --no-deps >/dev/null
      - name: Rust formatting
        working-directory: cliptown-clients/clients/rust
        run: cargo fmt --all --check
      - name: Rust Clippy
        working-directory: cliptown-clients/clients/rust
        run: cargo clippy --locked --all-targets --message-format=short -- -D warnings
      - name: Rust tests and shared-policy conformance
        working-directory: cliptown-clients/clients/rust
        env:
          RUST_BACKTRACE: '1'
        run: cargo test --locked --all-targets -- --nocapture

  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out clients
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cliptown-clients
          persist-credentials: false
          show-progress: false
      - name: Check out exact interfaces sibling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cliptown/cliptown-interfaces
          ref: ec4f820bcc9181c2423a6963d3890ddc8ef18b97
          path: cliptown-interfaces
          persist-credentials: false
          show-progress: false
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cliptown-clients/clients/typescript/package.json
      - name: Build interfaces
        working-directory: cliptown-interfaces/generated/typescript
        run: npm install && npm run build
      - name: Validate TypeScript client
        working-directory: cliptown-clients/clients/typescript
        run: npm install && npm run typecheck && npm test && npm run build

  dart:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out clients
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cliptown-clients
          persist-credentials: false
          show-progress: false
      - name: Check out exact interfaces sibling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cliptown/cliptown-interfaces
          ref: ec4f820bcc9181c2423a6963d3890ddc8ef18b97
          path: cliptown-interfaces
          persist-credentials: false
          show-progress: false
      - name: Set up Dart 3.12.2
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - name: Resolve Dart dependencies
        working-directory: cliptown-clients/clients/dart
        run: dart pub get
      - name: Dart formatting
        working-directory: cliptown-clients/clients/dart
        run: |
          dart format lib test
          git diff --exit-code -- lib test
      - name: Dart analysis
        working-directory: cliptown-clients/clients/dart
        run: dart analyze
      - name: Dart tests
        working-directory: cliptown-clients/clients/dart
        run: dart test --reporter=expanded

  package-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out clients
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
      - run: ./scripts/validate-layout.sh

  package-dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out clients
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cliptown-clients
          persist-credentials: false
          show-progress: false
      - name: Check out exact interfaces sibling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cliptown/cliptown-interfaces
          ref: ec4f820bcc9181c2423a6963d3890ddc8ef18b97
          path: cliptown-interfaces
          persist-credentials: false
          show-progress: false
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0
      - name: Build TypeScript package inputs
        run: |
          cd cliptown-interfaces/generated/typescript
          npm install
          npm run build
          cd ../../../cliptown-clients/clients/typescript
          npm install
          npm run build
      - name: Create registry-independent package dry runs
        working-directory: cliptown-clients
        run: node scripts/package-dry-run.mjs
      - name: Verify package manifest and checksums
        working-directory: cliptown-clients
        run: |
          set -euo pipefail
          test -s dist/package-dry-run/package-manifest.json
          test -s dist/package-dry-run/SHA256SUMS
          test "$(find dist/package-dry-run -maxdepth 1 -type f \( -name '*.crate' -o -name '*.tgz' -o -name '*.tar.gz' \) | wc -l)" -eq 3
          jq -e '.packages.rust.dependencies == ["cliptown-interfaces-rust@0.1.0", "cliptown-lib@0.1.0"]' dist/package-dry-run/package-manifest.json
          jq -e '.packages.zed_pkg.dependencies == ["cliptown/cliptown-interfaces@^0.1.0", "cliptown/cliptown-lib@^0.1.0"]' dist/package-dry-run/package-manifest.json
          if grep -RInE 'file:|path:|git =|rev =' dist/package-dry-run; then
            echo 'workspace-only dependency leaked into the release plan' >&2
            exit 1
          fi
      - name: Upload package rehearsal
        uses: actions/upload-artifact@v4
        with:
          name: cliptown-package-dry-run
          path: cliptown-clients/dist/package-dry-run
          if-no-files-found: error
