name: clients-ci
on: {pull_request: {}, push: {branches: [main]}}
permissions: {contents: read}

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {path: cliptown-clients}
      - id: interfaces-ref
        shell: bash
        env: {CANDIDATE: "${{ github.head_ref }}"}
        run: |
          ref=main
          if [[ -n "$CANDIDATE" ]] && git ls-remote --exit-code --heads https://github.com/cliptown/cliptown-interfaces.git "$CANDIDATE" >/dev/null 2>&1; then ref="$CANDIDATE"; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: cliptown/cliptown-interfaces
          ref: ${{ steps.interfaces-ref.outputs.ref }}
          path: cliptown-interfaces
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt, clippy}
      - name: Verify dependency graph
        working-directory: cliptown-clients/clients/rust
        run: cargo metadata --format-version 1 --no-deps >/dev/null
      - name: Rust formatting
        working-directory: cliptown-clients/clients/rust
        run: cargo fmt --check
      - name: Rust Clippy
        working-directory: cliptown-clients/clients/rust
        run: cargo clippy --all-targets --message-format=short -- -D warnings
      - name: Rust tests
        working-directory: cliptown-clients/clients/rust
        env: {RUST_BACKTRACE: "1"}
        run: cargo test --all-targets -- --nocapture

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {path: cliptown-clients}
      - id: interfaces-ref
        shell: bash
        env: {CANDIDATE: "${{ github.head_ref }}"}
        run: |
          ref=main
          if [[ -n "$CANDIDATE" ]] && git ls-remote --exit-code --heads https://github.com/cliptown/cliptown-interfaces.git "$CANDIDATE" >/dev/null 2>&1; then ref="$CANDIDATE"; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: cliptown/cliptown-interfaces
          ref: ${{ steps.interfaces-ref.outputs.ref }}
          path: cliptown-interfaces
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: cliptown-clients/clients/typescript/package.json}
      - working-directory: cliptown-interfaces/generated/typescript
        run: npm install && npm run build
      - working-directory: cliptown-clients/clients/typescript
        run: npm install && npm run typecheck && npm test && npm run build

  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {path: cliptown-clients}
      - id: interfaces-ref
        shell: bash
        env: {CANDIDATE: "${{ github.head_ref }}"}
        run: |
          ref=main
          if [[ -n "$CANDIDATE" ]] && git ls-remote --exit-code --heads https://github.com/cliptown/cliptown-interfaces.git "$CANDIDATE" >/dev/null 2>&1; then ref="$CANDIDATE"; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: cliptown/cliptown-interfaces
          ref: ${{ steps.interfaces-ref.outputs.ref }}
          path: cliptown-interfaces
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - name: Resolve Dart dependencies
        working-directory: cliptown-clients/clients/dart
        run: dart pub get
      - name: Dart formatting
        working-directory: cliptown-clients/clients/dart
        run: |
          dart format lib test
          git diff --exit-code -- lib test
      - name: Dart analysis
        working-directory: cliptown-clients/clients/dart
        run: dart analyze
      - name: Dart tests
        working-directory: cliptown-clients/clients/dart
        run: dart test --reporter=expanded

  package-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/validate-layout.sh

  package-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {path: cliptown-clients}
      - uses: actions/checkout@v4
        with:
          repository: cliptown/cliptown-interfaces
          ref: main
          path: cliptown-interfaces
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build TypeScript package inputs
        run: |
          cd cliptown-interfaces/generated/typescript
          npm install
          npm run build
          cd ../../../cliptown-clients/clients/typescript
          npm install
          npm run build
      - name: Create registry-independent package dry runs
        id: package_dry_run
        continue-on-error: true
        working-directory: cliptown-clients
        run: node scripts/package-dry-run.mjs >package-dry-run.log 2>&1
      - name: Upload package dry-run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cliptown-package-dry-run-diagnostics
          path: cliptown-clients/package-dry-run.log
          if-no-files-found: error
      - name: Enforce package dry-run result
        if: steps.package_dry_run.outcome == 'failure'
        working-directory: cliptown-clients
        run: cat package-dry-run.log && exit 1
      - name: Verify package manifest and checksums
        working-directory: cliptown-clients
        run: |
          test -s dist/package-dry-run/package-manifest.json
          test -s dist/package-dry-run/SHA256SUMS
          test "$(find dist/package-dry-run -maxdepth 1 -type f \( -name '*.crate' -o -name '*.tgz' -o -name '*.tar.gz' \) | wc -l)" -eq 3
          if grep -RInE 'file:|path:' dist/package-dry-run/package-manifest.json; then
            echo 'workspace-only dependencies leaked into the release plan' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cliptown-package-dry-run
          path: cliptown-clients/dist/package-dry-run
          if-no-files-found: error
