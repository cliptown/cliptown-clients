name: Clients CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dart-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
      - name: Install dependencies
        run: dart pub get
        working-directory: dart
      - name: Run Dart tests
        run: dart test
        working-directory: dart

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Rust tests
        run: cargo test --verbose
        working-directory: rust

  ts-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
        working-directory: typescript
      - name: Run TS tests
        run: npm test
        working-directory: typescript
