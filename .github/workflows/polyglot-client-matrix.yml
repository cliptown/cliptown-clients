name: polyglot client matrix

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - name: Validate canonical Zed matrix
        run: python3 scripts/check-polyglot-matrix.py
      - name: Validate every SDK against the JSON-Schema API contract
        run: |
          python3 -m pip install --disable-pip-version-check jsonschema==4.25.1
          python3 scripts/verify_client_contract.py
      - name: Compile C11 slice
        run: cc -std=c11 -Wall -Wextra -Werror -Iclients/c/include -c clients/c/src/client.c -o /tmp/cliptown-client-c.o
      - name: Compile C++17 slice
        run: printf '#include "cliptown/client.hpp"\nint main(){cliptown::Client c{"https://example.invalid"}; return c.endpoint("v1/transfers").empty();}\n' | c++ -std=c++17 -Wall -Wextra -Werror -Iclients/cpp/include -x c++ - -o /tmp/cliptown-client-cpp
      - name: Validate Python 3 source
        run: python3 -m compileall -q clients/python/src
      - name: Validate Ruby source
        run: ruby -c clients/ruby/lib/cliptown_client.rb
      - name: Validate PHP source
        run: php -l clients/php/src/Client.php
      - name: Validate Maven package metadata
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("clients/java/pom.xml")
          ET.parse("clients/kotlin/pom.xml")
          PY
