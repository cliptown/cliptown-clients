[package]
org = "cliptown"
name = "cliptown-clients"
version = "0.1.0"
description = "Official Rust, TypeScript, and Dart clients for ClipTown"
license = "MIT"
keywords = ["clipboard", "sdk", "sync", "e2ee"]

[package.repository]
vcs = "git"
url = "https://github.com/cliptown/cliptown-clients"

[publish]
include_readme = true
tag_format = "v{version}"

[targets.nodejs]
dir = "clients/typescript"
name = "@cliptown/client"
adapter = "node"

[targets.dart]
dir = "clients/dart"
name = "cliptown_client"

[targets.rust]
dir = "clients/rust"
name = "cliptown-client-rust"
