[package]
org = "cliptown"
name = "cliptown-clients"
version = "0.1.0"
description = "Official polyglot clients for ClipTown"
license = "MIT"
keywords = ["clipboard", "sdk", "sync", "e2ee", "polyglot"]

[package.repository]
vcs = "git"
url = "https://github.com/cliptown/cliptown-clients"

[install]
dir = ".vendor/.zed"

[dependencies]
"cliptown/cliptown-interfaces" = "^0.1.0"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".vendor/.zed/**", "**/node_modules/**", "**/target/**", "**/dist/**", "**/.build/**"]

[targets.repository]
dir = "."

[targets.nodejs]
dir = "clients/typescript"
name = "@cliptown/client"
adapter = "node"

[targets.golang]
dir = "clients/go"
adapter = "go"

[targets.python]
dir = "clients/python"
adapter = "python"

[targets.ruby]
dir = "clients/ruby"

[targets.php]
dir = "clients/php"

[targets.rust]
dir = "clients/rust"
adapter = "rust"

[targets.dart]
dir = "clients/dart"
adapter = "dart"

[targets.gleam]
dir = "clients/gleam"

[targets.erlang]
dir = "clients/erlang"

[targets.elixir]
dir = "clients/elixir"

[targets.java]
dir = "clients/java"
adapter = "java"

[targets.kotlin]
dir = "clients/kotlin"
adapter = "java"

[targets.swift]
dir = "clients/swift"
