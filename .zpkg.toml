[package]
org = "cliptown"
name = "cliptown-clients"
version = "0.1.0"
description = "Official Rust, TypeScript, Dart, and Go clients for ClipTown"
license = "MIT"
keywords = ["clipboard", "sdk", "sync", "e2ee"]

[package.repository]
vcs = "git"
url = "https://github.com/cliptown/cliptown-clients"

[install]
dir = ".vendor/.zed"

[dependencies]
"cliptown/cliptown-interfaces" = "^0.1.0"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".vendor/.zed/**"]

[targets.nodejs]
dir = "clients/typescript"
name = "@cliptown/client"
adapter = "node"

[targets.dart]
dir = "clients/dart"
name = "cliptown_client"

[targets.rust]
dir = "clients/rust"
name = "cliptown-client-rust"

[targets.golang]
dir = "clients/go"
name = "github.com/cliptown/cliptown-clients/clients/go"
