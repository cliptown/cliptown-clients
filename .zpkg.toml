[package]
org = "cliptown"
name = "cliptown-clients"
version = "0.1.0"
description = "Official Rust, TypeScript, and Dart clients for ClipTown"
license = "MIT"
keywords = ["clipboard", "sdk", "sync", "e2ee"]

[package.repository]
vcs = "git"
url = "https://github.com/cliptown/cliptown-clients"

[dependencies]
"cliptown/cliptown-interfaces" = "^0.1.0"

[publish]
include_readme = true
tag_format = "v{version}"

[targets.repository]
dir = "."

[targets.nodejs]
dir = "clients/typescript"
name = "@cliptown/client"
adapter = "node"

[targets.python]
dir = "clients/python3"
adapter = "python"

[targets.golang]
dir = "clients/golang"
adapter = "go"

[targets.rust]
dir = "clients/rust"
name = "cliptown-client-rust"
adapter = "rust"

[targets.dart]
dir = "clients/dart"
name = "cliptown_client"
adapter = "dart"

[targets.gleam]
dir = "clients/gleamlang"
adapter = "none"

[targets.erlang]
dir = "clients/erlang"
adapter = "none"

[targets.elixir]
dir = "clients/elixir"
adapter = "none"

[targets.java]
dir = "clients/java"
adapter = "java"

[targets.kotlin]
dir = "clients/kotlin"
adapter = "java"

[targets.ruby]
dir = "clients/ruby"
adapter = "none"

[targets.php]
dir = "clients/php"
adapter = "none"

[targets.swift]
dir = "clients/swift"
